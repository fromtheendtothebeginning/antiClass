<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334A70"/>
      <stop offset="0.45" stop-color="#243653"/>
      <stop offset="1" stop-color="#141F33"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.18" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#9DB7DC" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#9DB7DC" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#9DB7DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldSmall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6DE"/>
      <stop offset="0.45" stop-color="#F0CE86"/>
      <stop offset="1" stop-color="#D3A14C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E4B863" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#E4B863" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#E4B863" stop-opacity="0"/>
    </radialGradient>
    <filter id="pshadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050B18" flood-opacity="0.4"/>
    </filter>
    <clipPath id="tile">
      <rect x="8" y="8" width="496" height="496" rx="116"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="8" y="8" width="496" height="496" fill="url(#sheen)"/>
    <g stroke="#A8C2E6" stroke-opacity="0.10" stroke-width="1">
      <path d="M40 8V504 M72 8V504 M104 8V504 M136 8V504 M168 8V504 M200 8V504 M232 8V504 M264 8V504 M296 8V504 M328 8V504 M360 8V504 M392 8V504 M424 8V504 M456 8V504 M488 8V504
               M8 40H504 M8 72H504 M8 104H504 M8 136H504 M8 168H504 M8 200H504 M8 232H504 M8 264H504 M8 296H504 M8 328H504 M8 360H504 M8 392H504 M8 424H504 M8 456H504 M8 488H504"/>
    </g>
    <g stroke="#A8C2E6" stroke-opacity="0.05" stroke-width="1">
      <path d="M136 8V504 M264 8V504 M392 8V504 M8 136H504 M8 264H504 M8 392H504"/>
    </g>
  </g>

  <circle cx="256" cy="290" r="192" fill="url(#glow)"/>

  <g filter="url(#pshadow)">
    <!-- faceted pentagon radar: brand mark, now in champagne gold -->
    <path d="M256 140 L396.7 242.2 L343.1 407.9 L168.9 407.9 L115.3 242.2 Z" fill="#E8BE6E"/>
    <path d="M256 288 L256 140 L396.7 242.2 Z" fill="#F8E0A8" fill-opacity="0.95"/>
    <path d="M256 288 L396.7 242.2 L343.1 407.9 Z" fill="#E9BE6C" fill-opacity="0.92"/>
    <path d="M256 288 L343.1 407.9 L168.9 407.9 Z" fill="#D6A050" fill-opacity="0.9"/>
    <path d="M256 288 L168.9 407.9 L115.3 242.2 Z" fill="#DEAC59" fill-opacity="0.92"/>
    <path d="M256 288 L115.3 242.2 L256 140 Z" fill="#F1CE87" fill-opacity="0.95"/>

    <!-- radar rings + spokes -->
    <g fill="none" stroke="#1A2740" stroke-linecap="round">
      <path d="M256 140 L396.7 242.2 L343.1 407.9 L168.9 407.9 L115.3 242.2 Z" stroke-opacity="0.30" stroke-width="4"/>
      <path d="M256 191.6 L350.9 260.7 L314.8 372.9 L197.2 372.9 L161.1 260.7 Z" stroke-opacity="0.18" stroke-width="3"/>
      <path d="M256 243.2 L305.1 279.2 L286.5 337.9 L225.5 337.9 L206.9 279.2 Z" stroke-opacity="0.12" stroke-width="2.5"/>
      <path d="M256 288 L256 230 M256 288 L313.4 244.2 M256 288 L290.6 356.2 M256 288 L221.4 356.2 M256 288 L198.6 244.2" stroke-opacity="0.16" stroke-width="3"/>
    </g>

    <!-- vertices -->
    <g fill="#FBEDC6" stroke="#B8812E" stroke-opacity="0.25" stroke-width="1.5">
      <circle cx="256" cy="140" r="8"/>
      <circle cx="396.7" cy="242.2" r="8"/>
      <circle cx="343.1" cy="407.9" r="8"/>
      <circle cx="168.9" cy="407.9" r="8"/>
      <circle cx="115.3" cy="242.2" r="8"/>
    </g>
    <path d="M256 140 L396.7 242.2 L343.1 407.9 L168.9 407.9 L115.3 242.2 Z" fill="none" stroke="#FFEBC0" stroke-opacity="0.5" stroke-width="2.5"/>
  </g>

  <!-- companion sparkle from the reference -->
  <path d="M404 58 Q410 92 442 98 Q410 104 404 138 Q398 104 366 98 Q398 92 404 58 Z"
        fill="url(#goldSmall)" stroke="#FFF1CE" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M404 58 Q410 92 442 98 Q410 92 404 98 Q398 92 366 98 Q398 92 404 58 Z"
        fill="#FFFFFF" fill-opacity="0.14"/>

  <rect x="9" y="9" width="494" height="494" rx="115" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
